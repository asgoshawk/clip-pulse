name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d0b03b1845f8b72c3b6a1e1d8c0 # v4.0.3
        with: { node-version: '22.14.0', cache: pnpm }
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test && pnpm check:language
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: cargo test --workspace
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: pnpm build
